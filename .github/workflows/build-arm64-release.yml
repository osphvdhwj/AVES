name: Build 64-bit Release APK (Signed)

on:
  workflow_dispatch:
  push:
    branches:
      - feature/ocr-integration
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'

jobs:
  build-arm64-release:
    name: Build ARM64 Release APK
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.27.4'
        cache: true

    - name: Decode Keystore from GitHub Secrets
      run: |
        echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > android/app/release.jks
        echo "✅ Keystore decoded successfully"

    - name: Create key.properties
      run: |
        cat > android/key.properties <<EOF
        storePassword=${{ secrets.KEYSTORE_PASSWORD }}
        keyPassword=${{ secrets.KEY_PASSWORD }}
        keyAlias=${{ secrets.KEY_ALIAS }}
        storeFile=android/app/release.jks
        googleApiKey=<NONE>
        EOF
        echo "✅ key.properties created"

    - name: Install Flutter dependencies
      run: |
        flutter pub get
        echo "✅ Dependencies installed"

    - name: Build arm64-v8a Release APK
      run: |
        flutter build apk \
          --release \
          --flavor play \
          -t lib/main_play.dart \
          --target-platform android-arm64 \
          --obfuscate \
          --split-debug-info=build/app/outputs/symbols
        echo "✅ Build completed"
      env:
        FLUTTER_DISABLE_ANALYTICS: 'true'

    - name: Rename APK for clarity
      run: |
        cd build/app/outputs/flutter-apk
        mv app-play-release.apk aves-ocr-arm64-v8a-release.apk
        ls -lh aves-ocr-arm64-v8a-release.apk
        echo "✅ APK renamed and ready"

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: aves-ocr-arm64-release
        path: build/app/outputs/flutter-apk/aves-ocr-arm64-v8a-release.apk
        retention-days: 30

    - name: Upload Debug Symbols (for crash analysis)
      uses: actions/upload-artifact@v4
      with:
        name: debug-symbols
        path: build/app/outputs/symbols/
        retention-days: 90

    - name: Build Summary
      run: |
        echo "## 🎉 Build Successful!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📦 APK Details" >> $GITHUB_STEP_SUMMARY
        echo "- **Architecture:** arm64-v8a (64-bit)" >> $GITHUB_STEP_SUMMARY
        echo "- **Build Type:** Release (Signed & Optimized)" >> $GITHUB_STEP_SUMMARY
        echo "- **Flavor:** Play" >> $GITHUB_STEP_SUMMARY
        echo "- **Features:** Google Lens-style OCR with text selection" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📥 Download" >> $GITHUB_STEP_SUMMARY
        echo "Download the APK from the Artifacts section above." >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📱 Installation" >> $GITHUB_STEP_SUMMARY
        echo "1. Download \`aves-ocr-arm64-release\` artifact" >> $GITHUB_STEP_SUMMARY
        echo "2. Extract the ZIP" >> $GITHUB_STEP_SUMMARY
        echo "3. Install \`aves-ocr-arm64-v8a-release.apk\` on your device" >> $GITHUB_STEP_SUMMARY
        echo "4. Long press on any image to use OCR!" >> $GITHUB_STEP_SUMMARY
