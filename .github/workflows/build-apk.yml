name: Build APK and Generate App Bundle

on:
  push:
    branches:
      - feature/ocr-integration
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.13.2'

      - name: Install dependencies
        run: flutter pub get
        env:
          FLUTTER_DISABLE_ANALYTICS: 'true'

      - name: Build APK (Play flavor)
        run: flutter build apk --release --flavor play
        env:
          FLUTTER_DISABLE_ANALYTICS: 'true'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aves-ocr-apk
          path: build/app/outputs/flutter-apk/app-play-release.apk
