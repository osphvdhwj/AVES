name: OCR Integration Tests

on:
  push:
    branches: [ feature/ocr-integration ]
  pull_request:
    branches: [ develop, feature/ocr-integration ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Run OCR unit tests
        run: flutter test test/services/ocr_service_test.dart
      
      - name: Analyze code
        run: flutter analyze lib/services/ocr/
      
      - name: Check formatting
        run: dart format --set-exit-if-changed lib/services/ocr/ lib/widgets/viewer/overlay/ocr_overlay.dart
