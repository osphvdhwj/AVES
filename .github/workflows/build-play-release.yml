name: Build Play Flavor Release APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g., 1.0.0-ocr)'
        required: false
        default: 'ocr-build'

jobs:
  build_play_release:
    name: Build Play Flavor Release APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: feature/ocr-integration

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "❌ Error: KEYSTORE_B64 secret not set"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/app/release.jks
          echo "✅ Keystore decoded successfully"

      - name: Create key.properties file
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          cat > android/key.properties << EOF
          storePassword=${KEYSTORE_PASSWORD}
          keyPassword=${KEY_PASSWORD}
          keyAlias=${KEY_ALIAS}
          storeFile=release.jks
          googleApiKey=${GOOGLE_API_KEY:-<NONE>}
          EOF
          echo "✅ key.properties created"

      - name: Build Play flavor release APK (split-per-abi)
        run: |
          echo "🔨 Building Play flavor release APK..."
          flutter build apk \
            --release \
            --flavor play \
            --target lib/main_play.dart \
            --split-per-abi \
            --obfuscate \
            --split-debug-info=build/app/outputs/symbols
          
          echo "✅ Build completed!"
          ls -lh build/app/outputs/flutter-apk/*.apk

      - name: Rename APK files with version
        run: |
          VERSION="${{ github.event.inputs.version_name }}"
          cd build/app/outputs/flutter-apk
          
          for apk in app-play-*-release.apk; do
            if [ -f "$apk" ]; then
              # Extract ABI from filename
              ABI=$(echo "$apk" | sed -n 's/app-play-\(.*\)-release.apk/\1/p')
              NEW_NAME="aves-play-${VERSION}-${ABI}.apk"
              mv "$apk" "$NEW_NAME"
              echo "✅ Renamed: $apk → $NEW_NAME"
              
              # Show APK info
              SIZE=$(du -h "$NEW_NAME" | cut -f1)
              echo "   Size: $SIZE"
            fi
          done

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: aves-play-arm64-v8a
          path: build/app/outputs/flutter-apk/aves-play-*-arm64-v8a.apk
          if-no-files-found: error

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: aves-play-armeabi-v7a
          path: build/app/outputs/flutter-apk/aves-play-*-armeabi-v7a.apk
          if-no-files-found: warn

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: aves-play-x86_64
          path: build/app/outputs/flutter-apk/aves-play-*-x86_64.apk
          if-no-files-found: warn

      - name: Generate build summary
        run: |
          echo "# 🎉 Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Build Configuration" >> $GITHUB_STEP_SUMMARY
          echo "- **Flavor**: Play (Google Play Services)" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ github.event.inputs.version_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: feature/ocr-integration" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Type**: Release (Signed & Obfuscated)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Features Included" >> $GITHUB_STEP_SUMMARY
          echo "✅ ML Kit OCR (Google Play Services)" >> $GITHUB_STEP_SUMMARY
          echo "✅ Google Lens-style text overlay" >> $GITHUB_STEP_SUMMARY
          echo "✅ Selectable text blocks" >> $GITHUB_STEP_SUMMARY
          echo "✅ Copy, share, search actions" >> $GITHUB_STEP_SUMMARY
          echo "✅ Multi-language support (Latin, Chinese, Devanagari, Japanese, Korean)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## APK Files Generated" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ls -lh build/app/outputs/flutter-apk/*.apk >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📥 Download" >> $GITHUB_STEP_SUMMARY
          echo "Download the APK artifacts from the workflow run page above." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Recommended**: Use the **arm64-v8a** APK for modern Android devices." >> $GITHUB_STEP_SUMMARY

      - name: Clean up sensitive files
        if: always()
        run: |
          rm -f android/app/release.jks
          rm -f android/key.properties
          echo "✅ Cleanup completed"
