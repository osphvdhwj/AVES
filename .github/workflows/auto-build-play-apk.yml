name: Auto Build Play APK on Push

on:
  push:
    branches:
      - feature/ocr-integration-updates
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/**'
      - '!.github/workflows/**'

jobs:
  build-play-apk:
    name: Build Play Flavor APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: feature/ocr-integration-updates

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "⚠️ Warning: KEYSTORE_B64 secret not set. Cannot build signed APK."
            echo "Please add keystore secrets to repository settings."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/app/release.jks
          echo "✅ Keystore decoded successfully"
          ls -lh android/app/release.jks

      - name: Create key.properties file
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          cat > android/key.properties << EOF
          storePassword=${KEYSTORE_PASSWORD}
          keyPassword=${KEY_PASSWORD}
          keyAlias=${KEY_ALIAS}
          storeFile=release.jks
          googleApiKey=${GOOGLE_API_KEY:-<NONE>}
          EOF
          echo "✅ key.properties created"

      - name: Get commit info
        id: commit_info
        run: |
          echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "commit_msg=$(git log -1 --pretty=%s)" >> $GITHUB_OUTPUT
          echo "author=$(git log -1 --pretty=%an)" >> $GITHUB_OUTPUT
          echo "date=$(date +'%Y%m%d-%H%M')" >> $GITHUB_OUTPUT

      - name: Build Play flavor release APK
        run: |
          echo "🔨 Building Play flavor APK for feature/ocr-integration-updates..."
          echo "Flutter: $(flutter --version | head -n 1)"
          echo "Dart: $(dart --version | head -n 1)"
          echo "Commit: ${{ steps.commit_info.outputs.short_sha }}"
          
          flutter build apk \
            --release \
            --flavor play \
            --target lib/main_play.dart \
            --split-per-abi \
            --obfuscate \
            --split-debug-info=build/app/outputs/symbols
          
          echo ""
          echo "✅ Build completed!"
          echo "APK files generated:"
          ls -lh build/app/outputs/flutter-apk/*.apk
          echo ""
          echo "Total APKs: $(ls build/app/outputs/flutter-apk/*.apk | wc -l)"

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: aves-play-arm64-v8a-${{ steps.commit_info.outputs.date }}-${{ steps.commit_info.outputs.short_sha }}
          path: build/app/outputs/flutter-apk/app-arm64-v8a-play-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: aves-play-armeabi-v7a-${{ steps.commit_info.outputs.date }}-${{ steps.commit_info.outputs.short_sha }}
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-play-release.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: aves-play-x86_64-${{ steps.commit_info.outputs.date }}-${{ steps.commit_info.outputs.short_sha }}
          path: build/app/outputs/flutter-apk/app-x86_64-play-release.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Generate build summary
        run: |
          echo "# 🎉 Auto-Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Commit Information" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ steps.commit_info.outputs.short_sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Message**: ${{ steps.commit_info.outputs.commit_msg }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Author**: ${{ steps.commit_info.outputs.author }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Time**: ${{ steps.commit_info.outputs.date }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Build Configuration" >> $GITHUB_STEP_SUMMARY
          echo "- **Flutter**: 3.27.4" >> $GITHUB_STEP_SUMMARY
          echo "- **Flavor**: Play (Google Play Services)" >> $GITHUB_STEP_SUMMARY
          echo "- **Type**: Release (Signed & Obfuscated)" >> $GITHUB_STEP_SUMMARY
          echo "- **Split**: Per-ABI (3 separate APKs)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Features" >> $GITHUB_STEP_SUMMARY
          echo "✅ ML Kit OCR (Google Play Services)" >> $GITHUB_STEP_SUMMARY
          echo "✅ Google Lens-style overlay" >> $GITHUB_STEP_SUMMARY
          echo "✅ 5 language families supported" >> $GITHUB_STEP_SUMMARY
          echo "✅ Copy, share, search actions" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## APK Files" >> $GITHUB_STEP_SUMMARY
          echo '```
          ls -lh build/app/outputs/flutter-apk/*.apk >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📥 Download" >> $GITHUB_STEP_SUMMARY
          echo "**Recommended**: arm64-v8a APK for modern Android devices" >> $GITHUB_STEP_SUMMARY

      - name: Clean up
        if: always()
        run: |
          rm -f android/app/release.jks android/key.properties
          echo "✅ Cleanup completed"
          
