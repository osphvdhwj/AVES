name: Build and Release APK

on:
  push:
    branches:
      - feature/add-ocr

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.27.4

      - name: Generate keystore
        run: |
          keytool -genkey -v \
          -keystore android/app/my-release-key.jks \
          -storepass ${{ secrets.KEYSTORE_PASSWORD }} \
          -alias ${{ secrets.KEY_ALIAS }} \
          -keypass ${{ secrets.KEY_PASSWORD }} \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -dname "CN=GitHub Actions, OU=DevOps, O=MyCompany, L=City, ST=State, C=Country"

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --flavor play -t lib/main_play.dart

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aves-app-play-apk
          path: build/app/outputs/flutter-apk/app-play-release.apk

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v3
        with:
          name: aves-app-play-apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: build/app/outputs/flutter-apk/app-play-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
